name: Tagged release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-tag:
    name: Validate tag and signing configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require tag to match Cargo package version
        shell: bash
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "eu5-location-filter") | .version')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Require tagged commit on main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require every signing credential
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          MACOS_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ACCOUNT: ${{ secrets.APPLE_ID }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          GPG_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY_BASE64 }}
          GPG_PASSWORD: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          GPG_FINGERPRINT: ${{ secrets.RELEASE_GPG_FINGERPRINT }}
        run: |
          missing=0
          for name in WINDOWS_CERTIFICATE WINDOWS_PASSWORD MACOS_CERTIFICATE MACOS_PASSWORD MACOS_IDENTITY APPLE_ACCOUNT APPLE_TEAM APPLE_PASSWORD GPG_KEY GPG_PASSWORD GPG_FINGERPRINT; do
            if [ -z "${!name}" ]; then
              echo "::error::Required release secret $name is not configured"
              missing=1
            fi
          done
          test "$missing" -eq 0

  build:
    name: Build and sign ${{ matrix.name }}
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86-64-v3
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Windows ARMv8-A
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: Linux x86-64-v3
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Linux ARMv8-A
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macOS Intel x86-64-v3
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rolling nightly
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libx11-xcb-dev libxcursor-dev libxkbcommon-x11-dev libx11-dev libgl1-mesa-dev
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Sign Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $toolArchitecture = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { "arm64" } else { "x64" }
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.Directory.Name -eq $toolArchitecture } |
            Sort-Object FullName |
            Select-Object -Last 1
          if ($null -eq $signTool) {
            throw "Windows SDK signtool.exe for $toolArchitecture was not found"
          }
          $binary = "target/${{ matrix.target }}/release/eu5-location-filter.exe"
          & $signTool.FullName sign /f $certificate /p $env:CERTIFICATE_PASSWORD /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 /d "EU5 Location Filter" /du "https://github.com/younghyun1/eu5-location-filter" $binary
          if ($LASTEXITCODE -ne 0) {
            throw "Authenticode signing failed"
          }
          & $signTool.FullName verify /pa /all /v $binary
          if ($LASTEXITCODE -ne 0) {
            throw "Authenticode verification failed"
          }
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "eu5-location-filter-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$package" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/eu5-location-filter.exe" "dist/$package/"
          Copy-Item README.md,LICENSE-MIT,LICENSE-APACHE "dist/$package/"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"
      - name: Package Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package="eu5-location-filter-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/eu5-location-filter" README.md LICENSE-MIT LICENSE-APACHE "dist/$package/"
          chmod +x "dist/$package/eu5-location-filter"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
      - name: Sign, notarize, and package macOS application
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

          package="eu5-location-filter-$GITHUB_REF_NAME-${{ matrix.target }}"
          stage="dist/$package"
          application="$stage/EU5 Location Filter.app"
          mkdir -p "$application/Contents/MacOS" "$application/Contents/Resources"
          cp "target/${{ matrix.target }}/release/eu5-location-filter" "$application/Contents/MacOS/"
          cp packaging/macos/Info.plist "$application/Contents/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          version="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$application/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$application/Contents/Info.plist"
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$application"
          codesign --verify --deep --strict --verbose=2 "$application"

          archive="dist/$package.zip"
          ditto -c -k --keepParent "$stage" "$archive"
          xcrun notarytool submit "$archive" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple "$application"
          rm "$archive"
          ditto -c -k --keepParent "$stage" "$archive"
          xcrun stapler validate "$application"
          spctl --assess --type execute --verbose=2 "$application"
      - name: Upload packaged binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eu5-location-filter-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish-release:
    name: Verify and publish signed release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Import release-signing key
        shell: bash
        env:
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.RELEASE_GPG_PRIVATE_KEY_BASE64 }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          GPG_FINGERPRINT: ${{ secrets.RELEASE_GPG_FINGERPRINT }}
        run: |
          normalized_expected="$(printf '%s' "$GPG_FINGERPRINT" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          printf '%s' "$GPG_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release-signing-key.asc"
          gpg --batch --import "$RUNNER_TEMP/release-signing-key.asc"
          actual="$(gpg --batch --with-colons --fingerprint "$normalized_expected" | awk -F: '$1 == "fpr" { print toupper($10); exit }')"
          test -n "$actual"
          test "$actual" = "$normalized_expected"
          gpg --armor --export "$normalized_expected" > dist/RELEASE_SIGNING_KEY.asc
          printf '%s' "$normalized_expected" > "$RUNNER_TEMP/signing-fingerprint"
      - name: Generate checksums and detached signatures
        shell: bash
        env:
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          fingerprint="$(cat "$RUNNER_TEMP/signing-fingerprint")"
          cd dist
          sha256sum *.zip *.tar.gz RELEASE_SIGNING_KEY.asc > SHA256SUMS
          for file in *.zip *.tar.gz SHA256SUMS; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$fingerprint" --armor --detach-sign "$file"
          done
          gpg --verify SHA256SUMS.asc SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/*.asc
      - name: Publish release for existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
