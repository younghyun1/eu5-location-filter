[target.'cfg(target_arch = "x86_64")']
rustflags = [
    "-C", "target-cpu=x86-64-v3",
]

[target.'cfg(target_arch = "aarch64")']
rustflags = [
    "-C", "target-cpu=generic",
]

[target.wasm32-unknown-unknown]
# These instructions have broad browser support and let LLVM vectorize the fixed dataset scans.
rustflags = [
    "-C", "target-feature=+bulk-memory,+mutable-globals,+nontrapping-fptoint,+sign-ext,+reference-types,+multivalue,+simd128",
]
