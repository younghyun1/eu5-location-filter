[package]
name = "eu5-location-filter"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
authors = ["Young Hyun Chi"]
description = "Inspect and filter Europa Universalis V map locations"
documentation = "https://docs.rs/eu5-location-filter"
homepage = "https://github.com/younghyun1/eu5-location-filter"
repository = "https://github.com/younghyun1/eu5-location-filter"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["eu5", "map", "paradox", "iced"]
categories = ["games", "visualization"]
include = ["/assets/**", "/build.rs", "/build/**", "/src/**", "/tests/**", "/web/**", "/docs/**", "/README.md", "/CHANGELOG.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/rust-toolchain.toml"]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "eu5-location-filter"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
# Native window, importer and command line. Native iced features (executor, software renderer,
# X11 and Wayland) come from the non-wasm target table below, so no native feature combination
# can miss them.
desktop = ["dep:clap", "dep:iced", "dep:fontcull-klippa", "dep:fontcull-read-fonts", "dep:fontcull-skrifa", "dep:fontcull-write-fonts", "dep:png", "dep:ttf-parser"]
# Browser build; meaningful only on wasm32, where the wasm target table adds WebGL.
web = ["dep:iced"]
web-benchmark = ["web"]

[dependencies]
bitcode = { version = "0.6.9", default-features = false, features = ["derive", "std"] }
clap = { version = "4.6.6", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"], optional = true }
# Shared iced features: custom widgets, shaped text for every script, pixel-snapped quads, browser
# colour blending (host colours must match the site), and the wgpu renderer.
iced = { version = "=0.14.0", default-features = false, features = ["advanced", "advanced-shaping", "crisp", "web-colors", "wgpu"], optional = true }
memchr = { version = "2.8.3", default-features = false, features = ["std"] }
png = { version = "0.18.1", default-features = false, optional = true }
# Layout-preserving font subsetting for the font-pack tool; WOFF2 output is not used.
fontcull-klippa = { version = "0.1.2", optional = true }
fontcull-read-fonts = { version = "0.38.0", optional = true }
fontcull-skrifa = { version = "0.39.2", optional = true }
fontcull-write-fonts = { version = "0.44.3", optional = true }
# Font parsing for the font-pack tool: cmap coverage checks and name lookups.
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"], optional = true }
thiserror = "2.0.20"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Native iced needs an executor and, on Linux, a windowing backend; tiny-skia is the software
# fallback when no GPU adapter is available.
iced = { version = "=0.14.0", default-features = false, features = ["thread-pool", "tiny-skia", "wayland", "x11"], optional = true }
zstd = { version = "0.13.3", default-features = false }

[target.'cfg(target_family = "wasm")'.dependencies]
# WebGPU first, WebGL 2 when the browser has no WebGPU adapter.
iced = { version = "=0.14.0", default-features = false, features = ["webgl"], optional = true }
# Promise and Uint8Array for the host-provided asset fetch.
js-sys = "0.3.80"
ruzstd = { version = "0.9.0", default-features = false, features = ["std"] }
wasm-bindgen = "0.2.103"
# Awaits the host fetch promise.
wasm-bindgen-futures = "0.4.53"
# Window for About links (window.open, which the frame sandbox allows as a popup) and console
# for reporting a panic message before the module traps.
web-sys = { version = "0.3.80", default-features = false, features = ["Window", "console"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
iced_test = "=0.14.0"

[profile.release]
opt-level = 3
codegen-units = 1
debug = false
incremental = false
strip = true
lto = "fat"
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-simd",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-bulk-memory",
    "--enable-sign-ext",
    "--enable-reference-types",
    "--enable-multivalue",
]
